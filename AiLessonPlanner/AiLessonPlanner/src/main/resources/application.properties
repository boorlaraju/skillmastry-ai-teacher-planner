
spring.application.name=ai-teacher-planner
server.port=8080

# MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/ai_lesson_planner
#spring.datasource.username=root
#spring.datasource.password=root

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=raju12341234raju12341234raju12341234raju12341234
app.jwt.access-expiration-ms=900000

# Refresh token: 7 days
app.refresh.expiration-ms=604800000

# Cookie
app.cookie.secure=false

# React frontend
#app.cors.origin=http://localhost:5173
app.cors.origin=https://skillmastry-ai-teacher-planner-frontend.onrender.com

